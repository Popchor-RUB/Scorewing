<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MuseScore import — design review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #edf0f5; color: #202733; font: 14px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: auto; }
    h1 { margin: 0 0 6px; font-size: 23px; }
    p { margin: 0 0 16px; color: #526075; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 12px; }
    button { border: 1px solid #bec8d6; background: #fff; color: #394150; border-radius: 6px; padding: 9px 15px; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #285fd5; border-color: #285fd5; color: white; }
    button:focus-visible { outline: 3px solid #142f6a; outline-offset: 3px; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; border: 1px solid #d0d7e1; border-radius: 7px; background: white; }
    figcaption { padding: 12px 0 0; color: #526075; }
    [hidden] { display: none; }
    .note { margin-top: 14px; padding: 12px 16px; background: #fff8e8; border: 1px solid #d8b76a; border-radius: 6px; color: #714900; }
    @media (max-width: 600px) { body { padding: 14px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
<main>
  <h1>MuseScore import · design review</h1>
  <p>Visible sources start checked. Hidden sources stay available. Multi-staff instruments remain listed with disabled checkboxes.</p>
  <nav aria-label="Design states">
    <button type="button" aria-pressed="true" aria-controls="split" data-view="split">Split defaults</button>
    <button type="button" aria-pressed="false" aria-controls="merge" data-view="merge">Merge defaults</button>
    <button type="button" aria-pressed="false" aria-controls="warning" data-view="warning">Export warning</button>
  </nav>
  <figure id="split">
    <img src="screens/split.png" width="1100" height="760" alt="Split workspace: Soprano and Alto checked, hidden Tenor unchecked, two-staff Piano disabled. Original instruments stay in the export; generated staves are visible.">
    <figcaption>All originals keep their visibility. New results are visible. Each tool remembers its selections separately.</figcaption>
  </figure>
  <figure id="merge" hidden>
    <img src="screens/merge.png" width="1100" height="760" alt="Merge workspace with visible sources checked, hidden Tenor unchecked, Piano disabled, and the Create merge group action. Export stays disabled until a merge group exists.">
    <figcaption>Create groups using the existing workflow. Exports now keep selected source instruments alongside their merged results.</figcaption>
  </figure>
  <figure id="warning" hidden>
    <img src="screens/export-warning.png" width="1100" height="760" alt="Export completed with two warnings identifying missing tempo text at measure 24 beat 1 and rehearsal mark C at measure 32 beat 1. The file was saved.">
    <figcaption>Preserve tempo text, metronome marks, playback changes, and rehearsal marks score-wide. If preservation fails, export succeeds with specific warnings. Entries shown here are illustrative.</figcaption>
  </figure>
  <p class="note">Approved design reference. These Figcraft mockups document the implemented behavior.</p>
</main>
<script>
  const buttons = document.querySelectorAll('[data-view]');
  buttons.forEach(button => button.addEventListener('click', () => {
    buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    document.querySelectorAll('figure').forEach(figure => { figure.hidden = figure.id !== button.dataset.view; });
  }));
</script>
</body>
</html>
