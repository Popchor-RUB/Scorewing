[package]
name = "scorewing-desktop"
version = "0.1.0"
edition = "2021"
description = "MusicXML arranging and MuseScore practice tracks"

[[bin]]
name = "scorewing-desktop"
path = "src/main.rs"

[lib]
name = "scorewing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scorewing-core = { path = "../../../crates/scorewing-core" }
practice-tracks = { path = "../../../crates/practice-tracks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
