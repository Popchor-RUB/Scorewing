[package]
name = "mxml-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
xmltree = "0.11"
xml-rs = "0.8"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
libxml = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
same-file = "1"
similar = { version = "2.7", default-features = false }
