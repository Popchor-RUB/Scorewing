<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorewing update window — design review</title>
<style>
:root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); color: var(--foreground, #202631); }
* { box-sizing: border-box; }
html, body { margin: 0; }
main { display: grid; gap: 24px; }
header, figure, p { margin: 0; }
h1 { font-size: 20px; margin: 0 0 8px; }
p, figcaption { font-size: 13px; line-height: 1.5; color: var(--muted-foreground, #5f6c80); }
figure { display: grid; gap: 8px; }
img { display: block; width: 620px; max-width: 100%; height: auto; border: 1px solid var(--border, #d9dfe8); border-radius: var(--radius, 5px); }
figcaption strong { color: var(--foreground, #202631); }
a { color: var(--primary, #285bd7); }
</style>
</head>
<body>
<main>
<header>
<h1>Scorewing update window</h1>
<p>Revised design · 620 × 248 content area · sample versions · native title bar excluded</p>
<p><a href="scorewing-update-window.figcraft">Editable Figcraft document</a> · <a href="README.md">Design notes</a></p>
</header>
<figure>
<figcaption><strong>01 · Update available</strong> — light appearance</figcaption>
<img src="screens/available-light.png" width="1240" height="496" alt="Light update window showing a Scorewing icon, current and available versions, changelog link, restart notice, and Cancel, Skip this version, and Download and Install actions.">
</figure>
<figure>
<figcaption><strong>02 · Update available</strong> — dark appearance</figcaption>
<img src="screens/available-dark.png" width="1240" height="496" alt="The same update window in the application’s dark appearance.">
</figure>
<figure>
<figcaption><strong>03 · Installation disabled</strong> — score or work still open</figcaption>
<img src="screens/installation-disabled.png" width="1240" height="496" alt="Update window with Download and Install disabled and an explanation to close the score and wait for work to finish, including the warning that closing a score discards its editing choices.">
</figure>
</main>
</body>
</html>
