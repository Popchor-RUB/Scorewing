name: Test and build Rust CLI and desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build development container
        run: tools/devcontainer.sh build
      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mxml-cache
          key: linux-cargo-v1-${{ runner.arch }}-${{ hashFiles('.devcontainer/Containerfile', 'tools/devcontainer.sh', 'tools/build-libxml2.sh', 'rust-toolchain.toml', '.cargo/**') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            linux-cargo-v1-${{ runner.arch }}-${{ hashFiles('.devcontainer/Containerfile', 'tools/devcontainer.sh', 'tools/build-libxml2.sh', 'rust-toolchain.toml', '.cargo/**') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            linux-cargo-v1-${{ runner.arch }}-${{ hashFiles('.devcontainer/Containerfile', 'tools/devcontainer.sh', 'tools/build-libxml2.sh', 'rust-toolchain.toml', '.cargo/**') }}-
      - name: Test and build in Podman
        env:
          MXML_CACHE_DIR: ${{ runner.temp }}/mxml-cache
        run: tools/devcontainer.sh run bash tools/check.sh
      - name: Copy artifacts from build volume
        env:
          MXML_CACHE_DIR: ${{ runner.temp }}/mxml-cache
        run: tools/devcontainer.sh run bash tools/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: voiceweaver-linux-x64
          path: dist/*
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: voiceweaver-windows-x64
          - runner: macos-15-intel
            artifact: voiceweaver-macos-x64
          - runner: macos-15
            artifact: voiceweaver-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Windows XML dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "libxml2[core]:x64-windows-static"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: macOS XML dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm
          if [[ "$(uname -m)" == arm64 ]]; then export MACOSX_DEPLOYMENT_TARGET=11.0; else export MACOSX_DEPLOYMENT_TARGET=10.13; fi
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
          bash tools/build-libxml2.sh "$RUNNER_TEMP/libxml2"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libxml2/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}-${{ hashFiles('.github/workflows/build.yml', 'tools/build-libxml2.sh') }}
      - name: Frontend dependencies and checks
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Rust checks
        run: |
          node --test tools/*.test.mjs
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build -p mxml-cli --release --locked
      - name: Build desktop installer
        working-directory: apps/desktop
        run: npm run tauri -- build
      - name: Smoke test CLI
        shell: bash
        run: |
          target/release/voiceweaver --version
          node tools/check-linkage.mjs target/release/voiceweaver${{ runner.os == 'Windows' && '.exe' || '' }}
          node tools/check-linkage.mjs --desktop target/release/voiceweaver-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          cp docs/THIRD_PARTY_NOTICES.txt dist/
          cp target/release/voiceweaver.exe dist/ 2>/dev/null || cp target/release/voiceweaver dist/
          find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
          node tools/checksum.mjs dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
