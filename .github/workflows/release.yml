name: Build signed draft release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Popchor-RUB/Scorewing'
    strategy:
      fail-fast: false
      # Each upload merges latest.json; serialize to preserve all platform entries.
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Validate stable version tag and signing setup
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
          const frontend = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'));
          const rust = readFileSync('apps/desktop/src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          assert.match(config.version, /^\d+\.\d+\.\d+$/, 'Only stable versions belong on the latest-release feed');
          assert.equal(process.env.GITHUB_REF_NAME, `v${config.version}`, 'Tag must match the app version');
          assert.equal(frontend.version, config.version, 'Frontend version must match');
          assert.equal(rust, config.version, 'Rust desktop version must match');
          assert.ok(process.env.TAURI_SIGNING_PRIVATE_KEY, 'Set the TAURI_SIGNING_PRIVATE_KEY Actions secret');
          JS
      - name: Refuse to modify a published release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: 'Popchor-RUB', repo: 'Scorewing', tag: context.ref.replace('refs/tags/', '')
              });
              if (!data.draft) core.setFailed('This release is already published; use a new version tag.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libclang-dev libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file libfuse2t64 xdg-utils
      - name: Windows XML dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "libxml2[core]:x64-windows-static"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm
          if [[ "$(uname -m)" == arm64 ]]; then export MACOSX_DEPLOYMENT_TARGET=11.0; else export MACOSX_DEPLOYMENT_TARGET=10.13; fi
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Static XML dependencies
        if: runner.os != 'Windows'
        run: |
          bash tools/build-libxml2.sh "$RUNNER_TEMP/libxml2"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libxml2/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: signed-release-${{ matrix.runner }}
      - name: Frontend dependencies and tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
      - name: Rust and tooling tests
        run: |
          node --test tools/*.test.mjs
          cargo test --workspace --locked
      - name: Build and upload signed installers and updater manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          owner: Popchor-RUB
          repo: Scorewing
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Scorewing ${{ github.ref_name }}
          releaseBody: Review all platform installers and latest.json before publishing this release.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
