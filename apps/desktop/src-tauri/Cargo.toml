[package]
name = "mxml-desktop"
version = "0.1.0"
edition = "2021"
description = "MusicXML instrument merging and splitting"

[lib]
name = "mxml_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mxml-core = { path = "../../../crates/mxml-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
