name: Test and build Rust CLI and desktop

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-platforms.yml
  build:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref_type != 'tag')
    uses: ./.github/workflows/build-platforms.yml
    secrets: inherit
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'Popchor-RUB/Scorewing'
    permissions:
      contents: write
    uses: ./.github/workflows/build-platforms.yml
    with:
      release: true
    secrets: inherit
