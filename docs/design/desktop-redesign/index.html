<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoreWing desktop redesign</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#1f2937);font:13px/1.45 var(--font-sans,system-ui,sans-serif)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}label{font-weight:600}select,button{font:inherit;color:var(--foreground,#1f2937);background:var(--card,#fff);border:1px solid var(--border,#cbd5e1);border-radius:var(--radius,5px);padding:6px 10px;min-height:32px}select{max-width:100%;min-width:240px}button{cursor:pointer}button:hover{background:var(--secondary,#f1f5f9)}select:focus-visible,button:focus-visible{outline:2px solid var(--ring,#2860d5);outline-offset:2px}.count{color:var(--muted-foreground,#64748b);font-size:12px;margin-left:auto}figure{margin:0}figure[hidden]{display:none}img{display:block;max-width:100%;width:100%;height:auto;border:1px solid var(--border,#cbd5e1);border-radius:6px}figcaption{color:var(--muted-foreground,#64748b);font-size:12px;margin-top:8px}.note{color:var(--muted-foreground,#64748b);font-size:12px;margin:12px 0 0}@media(max-width:480px){.count{margin-left:0}select{min-width:190px;flex:1}}
@media(prefers-color-scheme:dark){body{--foreground:#e5e7eb;--card:#20242c;--border:#4b5563;--muted-foreground:#aab3c1;--secondary:#2b313c}}
</style></head><body>
<div class="controls"><label for="screen">Screen</label><select id="screen"><option value="start">Start</option><option value="chooser">Tool chooser</option><option value="split">Split instruments</option><option value="merge" selected>Merge instruments</option><option value="practice">Practice Tracks</option><option value="diff">Diff versions</option><option value="practiceDark">Practice Tracks · Dark</option><option value="chooserDark">Tool chooser · Dark</option><option value="compact">Split · Minimum window</option><option value="practiceCompact">Practice · Minimum window</option><option value="progress">Export progress</option><option value="success">Export complete</option><option value="renderer">Renderer settings</option><option value="sounds">Sound search</option><option value="partial">Partial export</option><option value="foundations">Design foundations</option></select><button id="previous" type="button" aria-label="Previous design screen">←</button><button id="next" type="button" aria-label="Next design screen">→</button><span id="count" class="count" role="status" aria-live="polite"></span></div>
<figure id="start" hidden><img src="screens/start.png" alt="Start desktop UI design"><figcaption>Start</figcaption></figure>
<figure id="chooser" hidden><img src="screens/tool-chooser.png" alt="Tool chooser desktop UI design"><figcaption>Tool chooser</figcaption></figure>
<figure id="split" hidden><img src="screens/split.png" alt="Split instruments desktop UI design"><figcaption>Split instruments</figcaption></figure>
<figure id="merge"><img src="screens/merge.png" alt="Merge instruments desktop UI design"><figcaption>Merge instruments</figcaption></figure>
<figure id="practice" hidden><img src="screens/practice.png" alt="Practice Tracks desktop UI design"><figcaption>Practice Tracks</figcaption></figure>
<figure id="diff" hidden><img src="screens/diff.png" alt="Diff versions desktop UI design"><figcaption>Diff versions</figcaption></figure>
<figure id="practiceDark" hidden><img src="screens/practice-dark.png" alt="Practice Tracks · Dark desktop UI design"><figcaption>Practice Tracks · Dark</figcaption></figure>
<figure id="chooserDark" hidden><img src="screens/tool-chooser-dark.png" alt="Tool chooser · Dark desktop UI design"><figcaption>Tool chooser · Dark</figcaption></figure>
<figure id="compact" hidden><img src="screens/split-compact.png" alt="Split · Minimum window desktop UI design"><figcaption>Split · Minimum window</figcaption></figure>
<figure id="practiceCompact" hidden><img src="screens/practice-compact.png" alt="Practice · Minimum window desktop UI design"><figcaption>Practice · Minimum window</figcaption></figure>
<figure id="progress" hidden><img src="screens/export-progress.png" alt="Export progress desktop UI design"><figcaption>Export progress</figcaption></figure>
<figure id="success" hidden><img src="screens/export-complete.png" alt="Export complete desktop UI design"><figcaption>Export complete</figcaption></figure>
<figure id="renderer" hidden><img src="screens/renderer-settings.png" alt="Renderer settings desktop UI design"><figcaption>Renderer settings</figcaption></figure>
<figure id="sounds" hidden><img src="screens/sound-search.png" alt="Sound search desktop UI design"><figcaption>Sound search</figcaption></figure>
<figure id="partial" hidden><img src="screens/partial-export.png" alt="Partial export desktop UI design"><figcaption>Partial export</figcaption></figure>
<figure id="foundations" hidden><img src="screens/foundations.png" alt="Design foundations desktop UI design"><figcaption>Design foundations</figcaption></figure>
<p class="note">Figcraft design review · Illustrative score data · Native window chrome varies by operating system · Application implementation follows design review.</p>
<script>
const picker=document.getElementById('screen');const screens=[...document.querySelectorAll('figure')];function show(){for(const screen of screens)screen.hidden=screen.id!==picker.value;document.getElementById('count').textContent=(picker.selectedIndex+1)+' / '+picker.options.length;}picker.addEventListener('change',show);document.getElementById('previous').addEventListener('click',()=>{picker.selectedIndex=(picker.selectedIndex-1+picker.options.length)%picker.options.length;show();});document.getElementById('next').addEventListener('click',()=>{picker.selectedIndex=(picker.selectedIndex+1)%picker.options.length;show();});show();
</script></body></html>
