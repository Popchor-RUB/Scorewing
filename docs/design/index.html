<script>
const picker=document.getElementById('screen');const screens=[...document.querySelectorAll('figure')];function show(){for(const screen of screens)screen.hidden=screen.id!==picker.value;document.getElementById('count').textContent=(picker.selectedIndex+1)+' / '+picker.options.length;}picker.addEventListener('change',show);document.getElementById('previous').addEventListener('click',()=>{picker.selectedIndex=(picker.selectedIndex-1+picker.options.length)%picker.options.length;show();});document.getElementById('next').addEventListener('click',()=>{picker.selectedIndex=(picker.selectedIndex+1)%picker.options.length;show();});show();
